<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Agent - Whangaparāoa</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 20px auto; padding: 0 15px; background: #f4f6f8; color: #222; }
    .card { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="number"], input[type="date"], select { padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    input[type="text"] { flex: 1; min-width: 0; }
    button { padding: 10px 14px; font-size: 14px; background: #0266c8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    button:disabled { background: #b0c4de; }


    .action-row { display: flex; gap: 10px; width: 100%; }
    .action-row button { flex: 1; padding: 12px 10px; text-align: center; font-size: 14px; }

    .tag-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .filter-chip { font-size: 12px; padding: 4px 10px; border-radius: 16px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; user-select: none; }
    .filter-chip.active { background: #0266c8; color: white; border-color: #0266c8; }

    .task-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px; border-bottom: 1px solid #f0f0f0; border-radius: 6px; cursor: pointer; transition: background 0.15s ease; }
    .task-item:hover { background: #f8fafc; }
    .task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
    .HIGH { background: #ffe6e6; color: #cc0000; }
    .MEDIUM { background: #fff3cd; color: #856404; }
    .LOW { background: #e6f4ea; color: #137333; }
    .chip { font-size: 11px; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 10px; }
    .time-chip { font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .sched-chip { background: #dcfce7; color: #166534; font-weight: 600; }
    .lock-chip { background: #fef3c7; color: #92400e; font-weight: 600; }
    .summary { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
    .summary-total { font-size: 14px; margin-bottom: 10px; }
    .summary-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; margin: 10px 0 4px; }
    .week-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475569; margin: 2px 0; }
    .week-name { width: 70px; flex-shrink: 0; }
    .week-bar { flex: 1; background: #f1f5f9; border-radius: 4px; height: 10px; }
    .week-fill { background: #0369a1; border-radius: 4px; height: 10px; }
    .week-val { width: 90px; flex-shrink: 0; text-align: right; }
    .overdue-chip { background: #fee2e2; color: #991b1b; font-weight: 600; }
    .coach-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 14px; margin-top: 14px; border-radius: 4px; font-size: 14px; line-height: 1.5; }

    .action-btns { display: flex; gap: 4px; }
    .complete-btn { background: transparent; color: #16a34a; border: none; padding: 4px 6px; font-size: 16px; cursor: pointer; }
    .delete-btn { background: transparent; color: #94a3b8; border: none; padding: 4px 6px; font-size: 16px; cursor: pointer; }
    .delete-btn:hover { color: #ef4444; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: white; width: 90%; max-width: 480px; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-card h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group select { width: 100%; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #ef4444; color: white; }

    [hidden] { display: none !important; }
    .gate { max-width: 360px; margin: 80px auto; text-align: center; }
    .gate-msg { color: #b91c1c; font-size: 14px; min-height: 20px; margin: 10px 0; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-row h1 { margin: 0; }
  </style>
</head>
<body>

  <div id="signInGate" class="card gate" hidden>
    <h1 style="font-size: 22px; margin-top: 0;">AI Task Agent</h1>
    <p id="gateMsg" class="gate-msg"></p>
    <button id="signInBtn" onclick="signIn()">Sign in with Google</button>
  </div>

  <div id="app" hidden>
  <div class="header-row">
    <h1 style="font-size: 22px;">AI Task Agent</h1>
    <button class="btn-secondary" onclick="signOutUser()">Sign out</button>
  </div>

  <div class="card">
    <div class="action-row">
      <button onclick="scheduleWeek()" id="schedBtn" style="background: #16a34a;">📅 Plan My Week</button>
    </div>
    <div id="scheduleStatus" class="coach-box" style="display:none;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; margin-bottom:12px;">Add / Modify Task</h3>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="e.g. MOW LAWN 45M OUTDOOR">
      <button onclick="submitTask()" id="addBtn">Add</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; margin-bottom:12px;">Organized Queue <small style="font-size:11px; font-weight:normal; color:#64748b;">(Tap to edit)</small></h3>
    <div class="tag-filter-bar" id="tagFilterBar"></div>
    <div id="taskList">Loading tasks...</div>
  </div>

  <div class="card">
    <details id="completedDetails">
      <summary style="cursor: pointer; font-weight: 600;">Recently Completed</summary>
      <div id="completedList" style="margin-top: 12px;"></div>
    </details>
  </div>

  <div id="editModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <h3>Edit Task Details</h3>
      <input type="hidden" id="editTaskId">
      
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="editTitle">
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Priority</label>
          <select id="editPriority">
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Est. Minutes</label>
          <input type="number" id="editDuration" min="5" step="5">
        </div>
      </div>

      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="editTags" placeholder="e.g. Outdoor, Physical">
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <div style="display: flex; gap: 6px;">
          <input type="date" id="editDueDate" style="flex: 1;">
          <button type="button" id="clearDueDateBtn" class="btn-secondary" title="Remove the due date" onclick="clearEditDueDate()">Clear</button>
        </div>
      </div>

      <div class="form-group">
        <label>Repeats</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="editRecurFreq" style="flex: 1;" onchange="updateRecurUnit()">
            <option value="NONE">Does not repeat</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
            <option value="YEARLY">Yearly</option>
          </select>
          <span id="editRecurEvery">every</span>
          <input type="number" id="editRecurInterval" min="1" max="365" step="1" value="1" style="width: 70px;">
          <span id="editRecurUnit"></span>
        </div>
      </div>

      <div style="margin-top: 14px;">
        <button type="button" class="btn-secondary" title="Save these changes, then find a new time for this task" onclick="rescheduleFromModal()">🔄 Reschedule</button>
      </div>

      <div class="modal-actions">
        <div style="display: flex; gap: 6px;">
          <button class="btn-success" onclick="completeTaskFromModal()">✅ Complete</button>
          <button class="btn-danger" onclick="deleteTaskFromModal()">Delete</button>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button onclick="saveTaskEdits()">Save</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    // Config: the only place deployment-specific values live.
    const CONFIG = {
      functionsBase: "https://australia-southeast1-taskhub-next.cloudfunctions.net",
      firebaseSdk: "https://www.gstatic.com/firebasejs/12.18.0"
    };
    const endpoint = name => `${CONFIG.functionsBase}/${name}`;
    const ADD_TASK_URL = endpoint("addOrUpdateTask");
    const GET_TASKS_URL = endpoint("getTasks");
    const DIRECT_UPDATE_URL = endpoint("updateTaskDirect");
    const COMPLETE_TASK_URL = endpoint("completeTask");
    const SCHEDULE_URL = endpoint("generateWeeklySchedule");
    const RESCHEDULE_URL = endpoint("rescheduleTask");
    const COMPLETED_URL = endpoint("getCompletedTasks");

    // Firebase Auth. The SDK loads from the CDN and the web config from Hosting's reserved URL, so there is no build step or key in this file.
    let authLib = null;
    let firebaseAuth = null;
    let gateNotice = "";

    function showGate(message) {
      document.getElementById("app").hidden = true;
      document.getElementById("signInGate").hidden = false;
      document.getElementById("gateMsg").textContent = gateNotice || message || "";
      gateNotice = "";
    }

    function showApp() {
      document.getElementById("signInGate").hidden = true;
      document.getElementById("app").hidden = false;
    }

    async function initAuth() {
      try {
        const [appLib, lib, config] = await Promise.all([
          import(`${CONFIG.firebaseSdk}/firebase-app.js`),
          import(`${CONFIG.firebaseSdk}/firebase-auth.js`),
          fetch("/__/firebase/init.json").then(r => {
            if (!r.ok) throw new Error("Firebase config not found (is a web app registered for this project?)");
            return r.json();
          })
        ]);
        authLib = lib;
        firebaseAuth = lib.getAuth(appLib.initializeApp(config));
        lib.onAuthStateChanged(firebaseAuth, user => {
          if (user) {
            showApp();
            fetchTasks();
          } else {
            showGate("");
          }
        });
      } catch (err) {
        showGate("Sign-in is unavailable: " + err.message);
      }
    }

    async function signIn() {
      if (!authLib) return;
      document.getElementById("gateMsg").textContent = "";
      try {
        await authLib.signInWithPopup(firebaseAuth, new authLib.GoogleAuthProvider());
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
          document.getElementById("gateMsg").textContent = "Sign-in failed: " + err.message;
        }
      }
    }

    async function signOutUser() {
      if (authLib) await authLib.signOut(firebaseAuth);
    }

    // fetch with the signed-in user's ID token. A 401 or 403 sends the user back to the sign-in screen.
    async function apiFetch(url, options = {}) {
      const user = firebaseAuth && firebaseAuth.currentUser;
      if (!user) throw new Error("Not signed in");
      const token = await user.getIdToken();
      const res = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
      });
      if (res.status === 401 || res.status === 403) {
        gateNotice = res.status === 403
          ? "That Google account isn't allowed to use this app."
          : "Your sign-in was rejected. Please sign in again.";
        await signOutUser();
        throw new Error(gateNotice);
      }
      if (!res.ok) {
        // Surface the server's error instead of treating the body as data
        let message = `Request failed (${res.status})`;
        try {
          const body = await res.clone().json();
          if (body && body.error) message = body.error;
        } catch (e) { /* non-JSON error body */ }
        throw new Error(message);
      }
      return res;
    }

    let allTasks = [];
    let selectedTagFilter = null; // null = show all

    const PRIORITIES = ["HIGH", "MEDIUM", "LOW"];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    const NZ_TIME_ZONE = "Pacific/Auckland";
    const nzDayFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: NZ_TIME_ZONE, weekday: "short", day: "numeric", month: "short" });
    const nzTimeFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: NZ_TIME_ZONE, hour: "numeric", minute: "2-digit" });
    const nzKeyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: NZ_TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" });
    const calendarDayFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" });
    const weekNameFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: "UTC", day: "numeric", month: "short" });
    const DATE_ONLY = /^\d{4}-\d{2}-\d{2}$/;

    // Whole days from today (NZ) to the task's due date: negative when overdue, null without a valid due date.
    function daysUntilDue(t) {
      if (!DATE_ONLY.test(t.dueDate || "")) return null;
      const due = Date.parse(`${t.dueDate}T00:00:00Z`);
      const today = Date.parse(`${nzKeyFmt.format(new Date())}T00:00:00Z`);
      return isNaN(due) ? null : Math.round((due - today) / 86400000);
    }

    // Schedule text in NZ time for a task's scheduledStart/scheduledEnd, or "" if there is none.
    // Timed values are ISO 8601 with an offset; all-day values are YYYY-MM-DD with an exclusive end.
    function formatSchedule(start, end) {
      if (!start) return "";
      if (DATE_ONLY.test(start)) {
        const first = new Date(`${start}T00:00:00Z`);
        if (isNaN(first)) return "";
        let text = calendarDayFmt.format(first);
        if (DATE_ONLY.test(end || "")) {
          const last = new Date(Date.parse(`${end}T00:00:00Z`) - 24 * 60 * 60 * 1000);
          if (last > first) text += " – " + calendarDayFmt.format(last);
        }
        return text + " · all day";
      }
      const s = new Date(start);
      if (isNaN(s)) return "";
      const e = new Date(end);
      if (isNaN(e) || e <= s) return `${nzDayFmt.format(s)}, ${nzTimeFmt.format(s)}`;
      if (nzKeyFmt.format(s) === nzKeyFmt.format(e)) {
        return `${nzDayFmt.format(s)}, ${nzTimeFmt.format(s)} – ${nzTimeFmt.format(e)}`;
      }
      return `${nzDayFmt.format(s)} ${nzTimeFmt.format(s)} – ${nzDayFmt.format(e)} ${nzTimeFmt.format(e)}`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("tagFilterBar").addEventListener("click", e => {
        const chip = e.target.closest(".filter-chip");
        if (!chip) return;
        setFilter(chip.hasAttribute("data-all") ? null : chip.dataset.tag);
      });

      document.getElementById("taskList").addEventListener("click", e => {
        const item = e.target.closest(".task-item");
        if (!item) return;
        const taskId = item.dataset.id;
        const btn = e.target.closest("[data-action]");
        if (btn && item.contains(btn)) {
          if (btn.dataset.action === "complete") completeTask(taskId);
          else if (btn.dataset.action === "delete") deleteTask(taskId);
          return;
        }
        openEditModal(taskId);
      });

      initAuth();
    });

    async function fetchTasks() {
      const listContainer = document.getElementById("taskList");
      try {
        const res = await apiFetch(GET_TASKS_URL);
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
      } catch (err) {
        listContainer.innerHTML = "<p>Error loading tasks: " + esc(err.message) + "</p>";
      }
    }

    async function submitTask() {
      const input = document.getElementById("taskInput").value;
      if (!input) return;

      setLoading(true);
      try {
        const res = await apiFetch(ADD_TASK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        document.getElementById("taskInput").value = "";
        renderFilterBar();
        renderTasks();
      } catch (err) {
        alert("Error updating tasks: " + err.message);
      } finally {
        setLoading(false);
      }
    }

    async function completeTask(taskId) {
      try {
        const res = await apiFetch(COMPLETE_TASK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
        if (document.getElementById("completedDetails").open) fetchCompleted();
      } catch (err) {
        alert("Error completing task: " + err.message);
      }
    }

    async function completeTaskFromModal() {
      const taskId = document.getElementById("editTaskId").value;
      closeEditModal();
      await completeTask(taskId);
    }

    async function scheduleWeek() {
      const statusDiv = document.getElementById("scheduleStatus");
      statusDiv.style.display = "block";
      statusDiv.innerText = "Reading calendar, checking weather, and scheduling tasks...";

      try {
        const res = await apiFetch(SCHEDULE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (data.success) {
          const locked = data.lockedCount ? ` Locked tasks left as pinned: ${data.lockedCount}.` : "";
          statusDiv.innerText = `Success! Scheduled ${data.scheduledCount} tasks onto your Google Calendar.${locked}`;
          fetchTasks();
        } else {
          statusDiv.innerText = data.error || data.message || "Failed to generate schedule.";
        }
      } catch (err) {
        statusDiv.innerText = "Error scheduling week: " + err.message;
      }
    }

    function renderFilterBar() {
      const bar = document.getElementById("tagFilterBar");
      const tagMap = new Set();
      allTasks.forEach(t => (t.tags || []).forEach(tag => tagMap.add(tag)));

      let html = `<div class="filter-chip ${selectedTagFilter === null ? 'active' : ''}" data-all="1">All (${allTasks.length})</div>`;
      tagMap.forEach(tag => {
        const count = allTasks.filter(t => (t.tags || []).includes(tag)).length;
        html += `<div class="filter-chip ${selectedTagFilter === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)} (${count})</div>`;
      });
      bar.innerHTML = html;
    }

    function setFilter(tag) {
      selectedTagFilter = tag;
      renderFilterBar();
      renderTasks();
    }

    function scheduleChip(t) {
      const when = formatSchedule(t.scheduledStart, t.scheduledEnd);
      if (when) return `<span class="chip sched-chip" title="Scheduled on your calendar">📅 ${esc(when)}</span>`;
      // Scheduled before times were stored; refreshed by the next Plan My Week
      return t.googleCalendarEventId ? `<span class="chip sched-chip">📅 Synced</span>` : "";
    }

    function renderTasks() {
      const listContainer = document.getElementById("taskList");
      let filtered = allTasks;

      if (selectedTagFilter !== null) {
        filtered = allTasks.filter(t => (t.tags || []).includes(selectedTagFilter));
      }

      if (!filtered || filtered.length === 0) {
        listContainer.innerHTML = "<p style='color:#666;'>No active tasks in queue.</p>";
        return;
      }

      // Overdue tasks first (most overdue first), then everything else by rank
      filtered = [...filtered].sort((a, b) => {
        const da = daysUntilDue(a), db = daysUntilDue(b);
        const oa = da !== null && da < 0, ob = db !== null && db < 0;
        if (oa !== ob) return oa ? -1 : 1;
        if (oa && da !== db) return da - db;
        return a.order - b.order;
      });

      listContainer.innerHTML = filtered.map(t => `
        <div class="task-item" data-id="${esc(t.id)}">
          <div style="flex:1;">
            <strong>#${esc(t.order)} ${esc(t.title)}</strong>
            <div class="task-meta">
              <span class="badge ${PRIORITIES.includes(t.priority) ? t.priority : ''}">${esc(t.priority)}</span>
              <span class="time-chip">⏱️ ${esc(t.estimatedMinutes || 15)}m</span>
              ${(t.tags || []).map(tag => `<span class="chip">${esc(tag)}</span>`).join('')}
              ${(() => { const d = daysUntilDue(t); return d !== null && d < 0 ? `<span class="chip overdue-chip" title="Due ${esc(t.dueDate)}">⚠️ Overdue ${esc(-d)}d</span>` : ''; })()}
              ${t.dueDate ? `<span class="chip">Due: ${esc(t.dueDate)}</span>` : ''}
              ${scheduleChip(t)}
              ${t.locked ? `<span class="chip lock-chip" title="Pinned: its event was moved to your personal calendar, so Plan My Week leaves it alone">🔒 Locked</span>` : ''}
            </div>
          </div>
          <div class="action-btns">
            <button class="complete-btn" title="Complete & Archive Task" data-action="complete">✅</button>
            <button class="delete-btn" title="Delete Task" data-action="delete">❌</button>
          </div>
        </div>
      `).join("");
    }

    function openEditModal(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById("editTaskId").value = task.id;
      document.getElementById("editTitle").value = task.title || "";
      document.getElementById("editPriority").value = task.priority || "MEDIUM";
      document.getElementById("editDuration").value = task.estimatedMinutes || 15;
      document.getElementById("editTags").value = (task.tags || []).join(", ");
      document.getElementById("editDueDate").value = task.dueDate || "";
      const recurrence = task.recurrence;
      document.getElementById("editRecurFreq").value = recurrence && RECUR_UNITS[recurrence.frequency] ? recurrence.frequency : "NONE";
      document.getElementById("editRecurInterval").value = recurrence && recurrence.interval > 0 ? recurrence.interval : 1;
      updateRecurUnit();

      document.getElementById("editModal").style.display = "flex";
    }

    const RECUR_UNITS = { DAILY: "day(s)", WEEKLY: "week(s)", MONTHLY: "month(s)", YEARLY: "year(s)" };

    // Shows the interval controls only when the task repeats
    function updateRecurUnit() {
      const freq = document.getElementById("editRecurFreq").value;
      const repeats = freq !== "NONE";
      document.getElementById("editRecurEvery").style.display = repeats ? "" : "none";
      document.getElementById("editRecurInterval").style.display = repeats ? "" : "none";
      document.getElementById("editRecurUnit").textContent = repeats ? RECUR_UNITS[freq] : "";
    }

    function clearEditDueDate() {
      document.getElementById("editDueDate").value = "";
    }

    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === "editModal") closeEditModal();
    }

    async function saveTaskEdits() {
      const taskId = document.getElementById("editTaskId").value;
      const title = document.getElementById("editTitle").value;
      const priority = document.getElementById("editPriority").value;
      const estimatedMinutes = parseInt(document.getElementById("editDuration").value) || 15;
      const tagsRaw = document.getElementById("editTags").value;
      const dueDate = document.getElementById("editDueDate").value;

      const tags = tagsRaw.split(",").map(s => s.trim()).filter(Boolean);
      const freq = document.getElementById("editRecurFreq").value;
      const interval = Math.min(Math.max(parseInt(document.getElementById("editRecurInterval").value) || 1, 1), 365);
      const recurrence = freq === "NONE" ? null : { frequency: freq, interval };
      const updatedFields = { title, priority, estimatedMinutes, tags, dueDate, recurrence };

      closeEditModal();
      try {
        const res = await apiFetch(DIRECT_UPDATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId, action: "UPDATE", updatedFields })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
        return true;
      } catch (err) {
        alert("Failed to save changes: " + err.message);
        return false;
      }
    }

    // Saves the edits first so the new time reflects them, then moves just this task
    async function rescheduleFromModal() {
      const taskId = document.getElementById("editTaskId").value;
      if (!(await saveTaskEdits())) return;
      await rescheduleTask(taskId);
    }

    async function rescheduleTask(taskId) {
      const statusDiv = document.getElementById("scheduleStatus");
      const task = allTasks.find(t => t.id === taskId);
      statusDiv.style.display = "block";
      statusDiv.innerText = "Finding a new time...";
      try {
        const res = await apiFetch(RESCHEDULE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        allTasks = data.tasks || allTasks;
        renderFilterBar();
        renderTasks();
        statusDiv.innerText = `Rescheduled "${task ? task.title : "task"}".`;
      } catch (err) {
        statusDiv.innerText = "Error rescheduling: " + err.message;
      }
    }

    async function deleteTaskFromModal() {
      const taskId = document.getElementById("editTaskId").value;
      closeEditModal();
      await deleteTask(taskId);
    }

    async function deleteTask(taskId) {
      if (!confirm("Delete this task?")) return;
      try {
        const res = await apiFetch(DIRECT_UPDATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId, action: "DELETE" })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
      } catch (err) {
        alert("Error deleting task: " + err.message);
      }
    }

    function fmtMinutes(total) {
      const m = Math.round(Number(total) || 0);
      if (m < 60) return `${m}m`;
      return m % 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.floor(m / 60)}h`;
    }

    // Completion totals from getCompletedTasks: per week, by priority and by tag
    function renderSummary(summary) {
      if (!summary) return "";
      if (!summary.totalCount) {
        return `<div class="summary"><div class="summary-total" style="color:#666;">No completions in the last ${esc((summary.weeks || []).length)} weeks.</div></div>`;
      }
      const weeks = summary.weeks || [];
      const maxCount = Math.max(1, ...weeks.map(w => w.count));
      const weekRows = weeks.map(w => {
        const name = DATE_ONLY.test(w.weekStart) ? weekNameFmt.format(new Date(w.weekStart + "T00:00:00Z")) : w.weekStart;
        const pct = Math.round((w.count / maxCount) * 100);
        return `<div class="week-row"><span class="week-name">${esc(name)}</span><div class="week-bar"><div class="week-fill" style="width:${pct}%"></div></div><span class="week-val">${esc(w.count)} · ${esc(fmtMinutes(w.minutes))}</span></div>`;
      }).join("");
      const priorityChips = (summary.byPriority || []).filter(p => p.count > 0)
        .map(p => `<span class="badge ${PRIORITIES.includes(p.priority) ? p.priority : ''}">${esc(p.priority)} ${esc(p.count)} · ${esc(fmtMinutes(p.minutes))}</span>`).join(" ");
      const tagChips = (summary.byTag || []).slice(0, 10)
        .map(t => `<span class="chip">${esc(t.tag)} ${esc(t.count)} · ${esc(fmtMinutes(t.minutes))}</span>`).join(" ");
      return `
        <div class="summary">
          <div class="summary-total"><strong>${esc(summary.totalCount)}</strong> completed · <strong>${esc(fmtMinutes(summary.totalMinutes))}</strong> estimated, last ${esc(weeks.length)} weeks${summary.truncated ? " (newest entries only)" : ""}</div>
          <div class="summary-label">Per week (week starting Monday)</div>
          ${weekRows}
          ${priorityChips ? `<div class="summary-label">By priority</div><div class="task-meta" style="margin-top:0;">${priorityChips}</div>` : ""}
          ${tagChips ? `<div class="summary-label">By tag</div><div class="task-meta" style="margin-top:0;">${tagChips}</div>` : ""}
        </div>`;
    }

    async function fetchCompleted() {
      const list = document.getElementById("completedList");
      list.textContent = "Loading...";
      try {
        const res = await apiFetch(COMPLETED_URL);
        const data = await res.json();
        const tasks = data.tasks || [];
        if (tasks.length === 0) {
          list.innerHTML = "<p style='color:#666; margin:0;'>No completed tasks yet.</p>";
          return;
        }
        list.innerHTML = renderSummary(data.summary) + tasks.map(t => {
          const done = t.completedAt ? new Date(t.completedAt) : null;
          const when = done && !isNaN(done) ? `${nzDayFmt.format(done)}, ${nzTimeFmt.format(done)}` : "";
          return `
            <div class="task-item" style="cursor: default;">
              <div style="flex:1;">
                <strong>${esc(t.title)}</strong>
                <div class="task-meta">
                  <span class="badge ${PRIORITIES.includes(t.priority) ? t.priority : ''}">${esc(t.priority)}</span>
                  <span class="time-chip">⏱️ ${esc(t.estimatedMinutes || 15)}m</span>
                  ${(t.tags || []).map(tag => `<span class="chip">${esc(tag)}</span>`).join('')}
                  ${when ? `<span class="chip">✅ ${esc(when)}</span>` : ''}
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        list.innerHTML = "<p>Error loading completed tasks: " + esc(err.message) + "</p>";
      }
    }

    // Loaded each time the section is opened, so it is never stale
    document.getElementById("completedDetails").addEventListener("toggle", e => {
      if (e.target.open) fetchCompleted();
    });

    function setLoading(isLoading) {
      document.getElementById("addBtn").disabled = isLoading;
      document.getElementById("taskInput").disabled = isLoading;
    }
  </script>
</body>
</html>
