<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskHub Next - Whangaparāoa</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 20px auto; padding: 0 15px; background: #f4f6f8; color: #222; }
    .card { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="time"], select { padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    input[type="text"] { flex: 1; min-width: 0; }
    button { padding: 10px 14px; font-size: 14px; background: #0266c8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    button:disabled { background: #b0c4de; }


    .action-row { display: flex; gap: 10px; width: 100%; }
    .action-row button { flex: 1; padding: 12px 10px; text-align: center; font-size: 14px; }

    .tag-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .filter-chip { font-size: 12px; padding: 4px 10px; border-radius: 16px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; user-select: none; }
    .filter-chip.active { background: #0266c8; color: white; border-color: #0266c8; }
    .search-row { display: flex; gap: 6px; align-items: center; }
    .search-row button[hidden] { display: none; }
    .search-box { flex: 1; min-width: 0; }
    .search-box::-webkit-search-cancel-button { -webkit-appearance: none; } /* the Clear button replaces it, as phones show none */
    .filter-section { margin-top: 12px; }
    .filter-section > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: #475569; }
    .filter-section > summary small { font-weight: normal; color: #0266c8; }
    .filter-section > .tag-filter-bar { margin: 8px 0 0; }
    .project-actions { margin-top: 8px; }
    .project-actions .project-row { border-bottom: 0; padding: 4px 0; }
    .project-add { margin-top: 8px; }

    .task-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px; border-bottom: 1px solid #f0f0f0; border-radius: 6px; cursor: pointer; transition: background 0.15s ease; }
    .task-item:hover { background: #f8fafc; }
    .task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
    .HIGH { background: #ffe6e6; color: #cc0000; }
    .MEDIUM { background: #fff3cd; color: #856404; }
    .LOW { background: #e6f4ea; color: #137333; }
    .chip { font-size: 11px; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 10px; }
    .time-chip { font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .sched-chip { background: #dcfce7; color: #166534; font-weight: 600; }
    .lock-chip { background: #fef3c7; color: #92400e; font-weight: 600; }
    .held-chip { background: #ffedd5; color: #9a3412; font-weight: 600; }
    .material-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .material-row input[type="text"] { flex: 1; min-width: 0; }
    .material-row input[type="checkbox"] { width: auto; flex: none; }
    .material-row button { padding: 4px 9px; font-size: 13px; flex: none; }
    .material-group { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .material-group-title { font-weight: 600; font-size: 14px; cursor: pointer; }
    .summary { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
    .summary-total { font-size: 14px; margin-bottom: 10px; }
    .summary-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; margin: 10px 0 4px; }
    .week-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475569; margin: 2px 0; }
    .week-name { width: 70px; flex-shrink: 0; }
    .week-bar { flex: 1; background: #f1f5f9; border-radius: 4px; height: 10px; }
    .week-fill { background: #0369a1; border-radius: 4px; height: 10px; }
    .week-val { width: 90px; flex-shrink: 0; text-align: right; }
    .project-chip { background: #ccfbf1; color: #115e59; font-weight: 600; }
    .project-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .project-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
    .project-row button { padding: 6px 10px; font-size: 13px; }
    .repeat-chip { background: #ede9fe; color: #5b21b6; font-weight: 600; }
    .overdue-chip { background: #fee2e2; color: #991b1b; font-weight: 600; }
    .coach-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 14px; margin-top: 14px; border-radius: 4px; font-size: 14px; line-height: 1.5; }

    .action-btns { display: flex; gap: 4px; }
    .complete-btn { background: transparent; color: #16a34a; border: none; padding: 4px 6px; font-size: 16px; cursor: pointer; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; overscroll-behavior: contain; }
    .modal-card { background: white; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    body.modal-open { overflow: hidden; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 1100; display: flex; align-items: center; gap: 14px; max-width: 90%; background: #1f2937; color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.3); font-size: 14px; }
    .toast[hidden] { display: none; }
    .toast button { background: transparent; color: #7cc0ff; font-weight: 700; padding: 4px 6px; }
    .modal-card h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-group input, .form-group select { width: 100%; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .form-group input[type="checkbox"] { width: auto; margin-right: 6px; }
    .settings-current { font-size: 14px; color: #334155; }
    .place-results { margin-top: 6px; }
    .place-option { display: block; width: 100%; text-align: left; background: #f1f5f9; color: #334155; font-weight: 500; white-space: normal; margin-top: 4px; }
    .settings-note { font-size: 12px; color: #64748b; margin: 4px 0 0; }
    .settings-status { font-size: 13px; margin-top: 10px; min-height: 18px; color: #334155; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #ef4444; color: white; }

    [hidden] { display: none !important; }
    .gate { max-width: 360px; margin: 80px auto; text-align: center; }
    .gate-msg { color: #b91c1c; font-size: 14px; min-height: 20px; margin: 10px 0; }
    .app-header { position: sticky; top: 0; z-index: 100; background: #f4f6f8; padding-top: 8px; margin-bottom: 16px; border-bottom: 1px solid #dbe1e8; }
    .tab-bar { display: flex; gap: 4px; }
    .tab-btn { flex: 1 1 auto; font-size: 13px; background: transparent; color: #475569; border-radius: 6px 6px 0 0; border-bottom: 3px solid transparent; padding: 10px 6px; }
    .tab-btn small { font-weight: normal; color: #64748b; }
    .tab-btn.active { color: #0266c8; border-bottom-color: #0266c8; background: #fff; }
  </style>
</head>
<body>

  <div id="signInGate" class="card gate" hidden>
    <h1 style="font-size: 22px; margin-top: 0;">TaskHub Next</h1>
    <p id="gateMsg" class="gate-msg"></p>
    <button id="signInBtn" onclick="signIn()">Sign in with Google</button>
  </div>

  <div id="app" hidden>
  <header class="app-header">
    <nav class="tab-bar" id="tabBar">
      <button type="button" class="tab-btn active" data-tab="tasks">Tasks</button>
      <button type="button" class="tab-btn" data-tab="materials">Materials <small id="materialsCount"></small></button>
      <button type="button" class="tab-btn" data-tab="stats">Stats</button>
      <button type="button" class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="pageTasks" data-page="tasks">
  <div class="card">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add New Task">
      <button onclick="submitTask()" id="addBtn">Add</button>
    </div>
    <div class="form-group" style="margin: 10px 0 0;">
      <label style="font-weight: normal;"><input type="checkbox" id="manualToggle"> Enter the details myself</label>
    </div>
    <div id="manualFields" hidden style="margin-top: 10px;">
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label for="manualPriority">Priority</label>
          <select id="manualPriority">
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM" selected>MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="manualMinutes">Est. Minutes</label>
          <input type="number" id="manualMinutes" min="5" step="5" value="15" inputmode="numeric">
        </div>
      </div>
      <div class="form-group">
        <label for="manualTags">Tags (comma separated)</label>
        <input type="text" id="manualTags" placeholder="e.g. Outdoor, Physical">
      </div>
      <div class="form-group">
        <label for="manualDue">Due Date (optional)</label>
        <input type="date" id="manualDue">
      </div>
      <div class="form-group">
        <label>Repeats</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="manualRecurFreq" style="flex: 1;" onchange="updateRecurUnit('manual')">
            <option value="NONE">Does not repeat</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
            <option value="YEARLY">Yearly</option>
          </select>
          <span id="manualRecurEvery">every</span>
          <input type="number" id="manualRecurInterval" min="1" max="365" step="1" value="1" style="width: 70px;">
          <span id="manualRecurUnit"></span>
        </div>
      </div>
      <div class="form-group">
        <label>Project</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="manualProject" style="flex: 1;" onchange="updateProjectOrderField('manual')">
            <option value="">No project</option>
          </select>
          <input type="number" id="manualProjectOrder" min="1" max="999" step="1" placeholder="Order" title="Order number: lower numbers are scheduled first, empty means unordered" style="width: 90px;" disabled>
        </div>
      </div>
      <div class="form-group">
        <label>Materials</label>
        <div id="manualMaterials"></div>
        <div class="input-row" style="margin-top: 6px;">
          <input type="text" id="manualNewMaterialText" maxlength="100" placeholder="Add a material, e.g. 2 litres of paint">
          <button type="button" class="btn-secondary" id="addManualMaterialBtn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="queueCard">
      <div class="search-row">
        <input type="search" id="taskSearch" class="search-box" placeholder="Search tasks" autocomplete="off" enterkeyhint="search" aria-label="Search tasks">
        <button type="button" class="btn-secondary" id="clearSearchBtn" hidden>Clear</button>
      </div>
      <details class="filter-section" id="tagsDetails">
        <summary>Tags <small id="tagsActive"></small></summary>
        <div class="tag-filter-bar" id="tagFilterBar"></div>
      </details>
      <details class="filter-section" id="projectsDetails">
        <summary>Projects <small id="projectsActive"></small></summary>
        <div class="tag-filter-bar" id="projectFilterBar"></div>
        <div class="project-actions" id="projectActions"></div>
        <div class="input-row project-add">
          <input type="text" id="newProjectName" maxlength="100" placeholder="New project name, e.g. Kitchen reno">
          <button type="button" id="addProjectBtn">Add</button>
        </div>
        <div id="projectsStatus" class="settings-status"></div>
      </details>
      <div id="taskList" style="margin-top: 15px;">Loading tasks...</div>
  </div>

  </main>

  <main id="pageMaterials" data-page="materials" hidden>
  <div class="card">
    <h3 style="margin-top:0; margin-bottom:12px;">Materials to get</h3>
    <div id="materialsList"></div>
    <div id="materialsStatus" class="settings-status"></div>
  </div>
  </main>

  <main id="pageStats" data-page="stats" hidden>
  <div class="card">
    <h3 style="margin-top:0; margin-bottom:12px;">Recently completed</h3>
    <div id="completedList"></div>
  </div>
  </main>

  <main id="pageSettings" data-page="settings" hidden>
  <div class="card">
    <h3 style="margin-top:0; margin-bottom:12px;">Settings</h3>
    <div id="settingsBody">
      <div>
        <div class="form-group">
          <label>Location (weather and time zone)</label>
          <div id="settingsLocation" class="settings-current">Loading...</div>
          <div class="input-row" style="margin-top: 8px;">
            <input type="text" id="placeQuery" placeholder="Search for a place, e.g. Whangaparāoa">
            <button type="button" id="placeSearchBtn" class="btn-secondary">Search</button>
          </div>
          <div id="placeResults" class="place-results"></div>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label for="scheduleDays">Days to schedule</label>
            <input type="number" id="scheduleDays" min="1" max="28" step="1" inputmode="numeric">
          </div>
          <div style="flex: 1;">
            <label for="gapMinutes">Gap between tasks</label>
            <input type="number" id="gapMinutes" min="0" max="60" step="5" inputmode="numeric">
          </div>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label for="dayStart">Day starts</label>
            <input type="time" id="dayStart">
          </div>
          <div style="flex: 1;">
            <label for="dayEnd">Day ends</label>
            <input type="time" id="dayEnd">
          </div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="lunchEnabled"> Keep a lunch break free every day</label>
        </div>
        <div class="form-group" id="lunchFields" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label for="lunchTime">Lunch starts</label>
            <input type="time" id="lunchTime">
          </div>
          <div style="flex: 1;">
            <label for="lunchMinutes">Length</label>
            <input type="number" id="lunchMinutes" min="5" max="180" step="5" inputmode="numeric">
          </div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="schedEnabled"> Run the schedule automatically</label>
        </div>
        <div class="form-group">
          <label for="schedInterval">Repeat every</label>
          <select id="schedInterval">
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="240">4 hours</option>
            <option value="DAILY">Daily at 8pm</option>
          </select>
        </div>
        <p class="settings-note" id="settingsLastRun"></p>
        <div class="action-row" style="margin-top: 14px;">
          <button type="button" id="saveSettingsBtn">Save settings</button>
          <button type="button" id="schedBtn" style="background: #16a34a;" title="Read your calendar and reschedule every task now" onclick="scheduleWeek()">📅 Update now</button>
        </div>
        <div id="settingsStatus" class="settings-status"></div>
      </div>
    </div>
    <div id="scheduleStatus" class="coach-box" style="display:none;"></div>
  </div>
  </main>

  <div id="undoToast" class="toast" role="status" hidden>
    <span id="undoToastText"></span>
    <button type="button" id="undoToastBtn">Undo</button>
  </div>

  <div id="editModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <h3>Edit Task Details</h3>
      <input type="hidden" id="editTaskId">
      
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="editTitle">
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Priority</label>
          <select id="editPriority">
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Est. Minutes</label>
          <input type="number" id="editDuration" min="5" step="5">
        </div>
      </div>

      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="editTags" placeholder="e.g. Outdoor, Physical">
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <div style="display: flex; gap: 6px;">
          <input type="date" id="editDueDate" style="flex: 1;">
          <button type="button" id="clearDueDateBtn" class="btn-secondary" title="Remove the due date" onclick="clearEditDueDate()">Clear</button>
        </div>
      </div>

      <div class="form-group">
        <label>Repeats</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="editRecurFreq" style="flex: 1;" onchange="updateRecurUnit()">
            <option value="NONE">Does not repeat</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
            <option value="YEARLY">Yearly</option>
          </select>
          <span id="editRecurEvery">every</span>
          <input type="number" id="editRecurInterval" min="1" max="365" step="1" value="1" style="width: 70px;">
          <span id="editRecurUnit"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Project</label>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="editProject" style="flex: 1;" onchange="updateProjectOrderField()">
            <option value="">No project</option>
          </select>
          <input type="number" id="editProjectOrder" min="1" max="999" step="1" placeholder="Order" title="Order number: lower numbers are scheduled first, empty means unordered" style="width: 90px;" disabled>
        </div>
      </div>

      <div class="form-group">
        <label>Materials <small style="font-weight:normal; color:#64748b;">(the task is not scheduled until all are checked)</small></label>
        <div id="editMaterials"></div>
        <div class="input-row" style="margin-top: 6px;">
          <input type="text" id="newMaterialText" maxlength="100" placeholder="Add a material, e.g. 2 litres of paint">
          <button type="button" class="btn-secondary" id="addMaterialBtn">Add</button>
        </div>
      </div>

      <div style="margin-top: 14px;">
        <button type="button" class="btn-secondary" title="Save these changes, then find a new time for this task" onclick="rescheduleFromModal()">🔄 Reschedule</button>
      </div>

      <div class="modal-actions">
        <div style="display: flex; gap: 6px;">
          <button class="btn-success" onclick="completeTaskFromModal()">✅ Complete</button>
          <button class="btn-danger" onclick="deleteTaskFromModal()">Delete</button>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button onclick="saveTaskEdits()">Save</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    // Config: the only place deployment-specific values live.
    const CONFIG = {
      functionsBase: "https://australia-southeast1-taskhub-next.cloudfunctions.net",
      firebaseSdk: "https://www.gstatic.com/firebasejs/12.18.0"
    };
    const endpoint = name => `${CONFIG.functionsBase}/${name}`;
    const ADD_TASK_URL = endpoint("addOrUpdateTask");
    const GET_TASKS_URL = endpoint("getTasks");
    const DIRECT_UPDATE_URL = endpoint("updateTaskDirect");
    const COMPLETE_TASK_URL = endpoint("completeTask");
    const UNDO_URL = endpoint("undoRemove");
    const SCHEDULE_URL = endpoint("generateWeeklySchedule");
    const RESCHEDULE_URL = endpoint("rescheduleTask");
    const COMPLETED_URL = endpoint("getCompletedTasks");
    const GET_SETTINGS_URL = endpoint("getSettings");
    const UPDATE_SETTINGS_URL = endpoint("updateSettings");
    const GET_PROJECTS_URL = endpoint("getProjects");
    const UPDATE_PROJECT_URL = endpoint("updateProject");

    // Firebase Auth. The SDK loads from the CDN and the web config from Hosting's reserved URL, so there is no build step or key in this file.
    let authLib = null;
    let firebaseAuth = null;
    let gateNotice = "";

    function showGate(message) {
      document.getElementById("app").hidden = true;
      document.getElementById("signInGate").hidden = false;
      document.getElementById("gateMsg").textContent = gateNotice || message || "";
      gateNotice = "";
    }

    function showApp() {
      document.getElementById("signInGate").hidden = true;
      document.getElementById("app").hidden = false;
    }

    // The header tabs: one page visible at a time, the others hidden (not removed, so their state survives).
    function showTab(name) {
      const tab = normalizeTab(name);
      document.querySelectorAll("[data-page]").forEach(page => { page.hidden = page.dataset.page !== tab; });
      document.querySelectorAll("[data-tab]").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
      if (tab === "stats") fetchCompleted(); // loaded on every visit, so it is never stale
      if (tab === "settings" && !currentSettings) loadSettings();
      window.scrollTo(0, 0);
    }

    async function initAuth() {
      try {
        const [appLib, lib, config] = await Promise.all([
          import(`${CONFIG.firebaseSdk}/firebase-app.js`),
          import(`${CONFIG.firebaseSdk}/firebase-auth.js`),
          fetch("/__/firebase/init.json").then(r => {
            if (!r.ok) throw new Error("Firebase config not found (is a web app registered for this project?)");
            return r.json();
          })
        ]);
        authLib = lib;
        firebaseAuth = lib.getAuth(appLib.initializeApp(config));
        lib.onAuthStateChanged(firebaseAuth, user => {
          if (user) {
            showApp();
            fetchTasks();
            loadProjects();
            loadSettings();
          } else {
            showGate("");
          }
        });
      } catch (err) {
        showGate("Sign-in is unavailable: " + err.message);
      }
    }

    async function signIn() {
      if (!authLib) return;
      document.getElementById("gateMsg").textContent = "";
      try {
        await authLib.signInWithPopup(firebaseAuth, new authLib.GoogleAuthProvider());
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
          document.getElementById("gateMsg").textContent = "Sign-in failed: " + err.message;
        }
      }
    }

    async function signOutUser() {
      if (authLib) await authLib.signOut(firebaseAuth);
    }

    // fetch with the signed-in user's ID token. A 401 or 403 sends the user back to the sign-in screen.
    async function apiFetch(url, options = {}) {
      const user = firebaseAuth && firebaseAuth.currentUser;
      if (!user) throw new Error("Not signed in");
      const token = await user.getIdToken();
      const res = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` }
      });
      if (res.status === 401 || res.status === 403) {
        gateNotice = res.status === 403
          ? "That Google account isn't allowed to use this app."
          : "Your sign-in was rejected. Please sign in again.";
        await signOutUser();
        throw new Error(gateNotice);
      }
      if (!res.ok) {
        // Surface the server's error instead of treating the body as data
        let message = `Request failed (${res.status})`;
        try {
          const body = await res.clone().json();
          if (body && body.error) message = body.error;
        } catch (e) { /* non-JSON error body */ }
        throw new Error(message);
      }
      return res;
    }

    let allTasks = [];
    let tasksLoaded = false; // set once the list has been drawn
    let selectedTagFilter = null; // null = show all
    let selectedProjectFilter = null; // a project id, null = show all
    let editMaterials = []; // the materials list being edited in the modal: [{id, text, checked}]
    let manualMaterials = []; // the materials list of the add form's own entry, same shape
    let materialsBusy = false; // true while a check-off from the Materials card is being saved
    let allProjects = [];
    let projectsLoaded = false; // set once getProjects has answered; until then the edit form leaves project fields alone

    const PRIORITIES = ["HIGH", "MEDIUM", "LOW"];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // <pure-helpers>
    // The "Repeat every" select combines the schedule's frequency and interval: "DAILY" runs once a day at 20:00,
    // a number is the interval in minutes. The server keeps its separate fields.
    const DAILY_TIME = "20:00";
    const DEFAULT_INTERVAL_MINUTES = 60;
    function scheduleChoice(schedule) {
      return schedule && schedule.frequency === "INTERVAL" ? String(schedule.intervalMinutes) : "DAILY";
    }
    // The schedule fields for a choice. The interval the choice does not use is kept as stored, so switching back restores it.
    function scheduleFromChoice(choice, storedInterval) {
      const daily = choice === "DAILY";
      return {
        frequency: daily ? "DAILY" : "INTERVAL",
        time: DAILY_TIME,
        intervalMinutes: daily ? (Number(storedInterval) || DEFAULT_INTERVAL_MINUTES) : Number(choice)
      };
    }

    // Every tag in use, once each, alphabetically (ignoring case; the exact spelling breaks a tie). Pure.
    function sortedTags(tasks) {
      const tags = new Set();
      tasks.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
      const key = tag => tag.toLowerCase();
      return [...tags].sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : a < b ? -1 : a > b ? 1 : 0));
    }

    // The toast text after a delete or completion: the task's title is shortened to 40 characters.
    function removalMessage(kind, title) {
      const text = String(title || "").trim();
      const shown = text.length > 40 ? text.slice(0, 39).trimEnd() + "…" : text;
      return (kind === "COMPLETE" ? "Completed" : "Deleted") + (shown ? ` “${shown}”` : " task");
    }

    const TABS = ["tasks", "materials", "stats", "settings"];
    // The tab to show for a requested name; anything unknown falls back to the first tab.
    function normalizeTab(name) {
      return TABS.includes(name) ? name : TABS[0];
    }

    // No DOM or network access in this block: functions/test/frontend.test.js extracts it and runs it under Node.
    const DEFAULT_TIME_ZONE = "Pacific/Auckland"; // used until the settings load
    const DATE_ONLY = /^\d{4}-\d{2}-\d{2}$/;
    const calendarDayFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" });
    const weekNameFmt = new Intl.DateTimeFormat("en-NZ", { timeZone: "UTC", day: "numeric", month: "short" });

    function makeFormatters(timeZone) {
      return {
        day: new Intl.DateTimeFormat("en-NZ", { timeZone, weekday: "short", day: "numeric", month: "short" }),
        time: new Intl.DateTimeFormat("en-NZ", { timeZone, hour: "numeric", minute: "2-digit" }),
        key: new Intl.DateTimeFormat("en-CA", { timeZone, year: "numeric", month: "2-digit", day: "2-digit" })
      };
    }

    // The zone every date and time on the page is shown in: the configured one from the settings.
    let appTimeZone = DEFAULT_TIME_ZONE;
    let fmt = makeFormatters(appTimeZone);

    // Switch the page to another IANA zone. An unknown zone is ignored, so the page keeps showing sensible times.
    function setTimeZone(timeZone) {
      if (typeof timeZone !== "string" || !timeZone) return;
      try {
        fmt = makeFormatters(timeZone);
        appTimeZone = timeZone;
      } catch (e) { /* unknown zone: keep the current one */ }
    }

    // Whole days from today (in the configured zone) to the task's due date: negative when overdue, null without a valid due date.
    function daysUntilDue(t, now = new Date()) {
      if (!DATE_ONLY.test(t.dueDate || "")) return null;
      const due = Date.parse(`${t.dueDate}T00:00:00Z`);
      const today = Date.parse(`${fmt.key.format(now)}T00:00:00Z`);
      return isNaN(due) ? null : Math.round((due - today) / 86400000);
    }

    // "Thu, 22 Oct, 9:00 am" for an instant, in the configured zone.
    function formatInstant(date) {
      return `${fmt.day.format(date)}, ${fmt.time.format(date)}`;
    }

    // Schedule text in the configured zone for a task's scheduledStart/scheduledEnd, or "" if there is none.
    // Timed values are ISO 8601 with an offset; all-day values are YYYY-MM-DD with an exclusive end.
    function formatSchedule(start, end) {
      if (!start) return "";
      if (DATE_ONLY.test(start)) {
        const first = new Date(`${start}T00:00:00Z`);
        if (isNaN(first)) return "";
        let text = calendarDayFmt.format(first);
        if (DATE_ONLY.test(end || "")) {
          const last = new Date(Date.parse(`${end}T00:00:00Z`) - 24 * 60 * 60 * 1000);
          if (last > first) text += " – " + calendarDayFmt.format(last);
        }
        return text + " · all day";
      }
      const s = new Date(start);
      if (isNaN(s)) return "";
      const e = new Date(end);
      if (isNaN(e) || e <= s) return formatInstant(s);
      if (fmt.key.format(s) === fmt.key.format(e)) {
        return `${formatInstant(s)} – ${fmt.time.format(e)}`;
      }
      return `${fmt.day.format(s)} ${fmt.time.format(s)} – ${fmt.day.format(e)} ${fmt.time.format(e)}`;
    }

    // Open-Meteo geocoding, called straight from the browser (no API key, and no Firebase token is sent to it).
    function geocodeUrl(query) {
      return `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(String(query).trim())}&count=5&language=en&format=json`;
    }

    // One geocoding result as {name, latitude, longitude, timeZone}, or null when it lacks anything the settings need.
    // The name joins place, region and country without repeats and fits the 100-character limit.
    function placeFromGeocode(r) {
      if (!r || typeof r !== "object" || typeof r.name !== "string" || !r.name.trim()) return null;
      if (!Number.isFinite(r.latitude) || !Number.isFinite(r.longitude)) return null;
      if (typeof r.timezone !== "string" || !r.timezone) return null;
      const parts = [];
      for (const part of [r.name, r.admin1, r.country]) {
        if (typeof part === "string" && part.trim() && !parts.includes(part.trim())) parts.push(part.trim());
      }
      return { name: parts.join(", ").slice(0, 100), latitude: r.latitude, longitude: r.longitude, timeZone: r.timezone };
    }

    function placesFromGeocode(data) {
      return Array.isArray(data && data.results) ? data.results.map(placeFromGeocode).filter(Boolean) : [];
    }

    // The updateSettings body for the settings form. Every schedule field is sent whatever the frequency, so the
    // server's checks apply to each; the server stays the validator.
    function settingsPayload(form) {
      return {
        location: { name: form.location.name, latitude: form.location.latitude, longitude: form.location.longitude },
        timeZone: form.timeZone,
        scheduleDays: Number(form.scheduleDays),
        gapMinutes: Number(form.gapMinutes),
        day: { start: form.dayStart, end: form.dayEnd },
        lunch: { enabled: !!form.lunchEnabled, time: form.lunchTime, minutes: Number(form.lunchMinutes) },
        schedule: {
          enabled: !!form.enabled,
          frequency: form.frequency,
          time: form.time,
          intervalMinutes: Number(form.intervalMinutes)
        }
      };
    }

    // The addOrUpdateTask body for a task entered by hand (no AI): the title and the fields of the manual form. The
    // server validates every field and falls back to its default for an unusable one, so only the shape is made here.
    // A recurrence is sent only when the task repeats, and then every field of the edit form is present too: recurrence,
    // project (with its order number) and materials, each left out when empty.
    function manualTaskBody(form) {
      const manual = {
        title: String(form.title || "").trim(),
        priority: form.priority,
        dueDate: form.dueDate || "",
        estimatedMinutes: parseInt(form.estimatedMinutes, 10) || 15,
        tags: String(form.tags || "").split(",").map(t => t.trim()).filter(Boolean)
      };
      const recurrence = recurrenceFields(form.recurFreq, form.recurInterval);
      if (recurrence) manual.recurrence = recurrence;
      if (form.projectId) Object.assign(manual, projectFields(form.projectId, form.projectOrder));
      const materials = materialsFields(form.materials || []);
      if (materials) manual.materials = materials;
      return { manual };
    }

    // The recurrence of a Repeats control as a task field: null for "does not repeat" (or an unknown frequency), else
    // {frequency, interval} with the interval a whole number kept within 1..365 (1 when empty or unusable).
    const RECUR_FREQUENCIES = ["DAILY", "WEEKLY", "MONTHLY", "YEARLY"];
    function recurrenceFields(freq, intervalText) {
      if (!RECUR_FREQUENCIES.includes(freq)) return null;
      return { frequency: freq, interval: Math.min(Math.max(parseInt(intervalText, 10) || 1, 1), 365) };
    }

    // The success line for a full run: how many tasks, how far ahead the run looked, the last day it used, and any
    // tasks left unplaced or pinned. A task is only placed as early as it fits, so the last day can be well before
    // the end of the window; saying both makes that visible.
    function scheduleSummary(data) {
      const days = data.scheduleDays ? ` The window was ${data.scheduleDays} day${data.scheduleDays === 1 ? "" : "s"} ahead.` : "";
      const last = DATE_ONLY.test(data.lastScheduledDate || "") ? ` The last task is on ${calendarDayFmt.format(new Date(`${data.lastScheduledDate}T00:00:00Z`))}.` : "";
      const left = data.unscheduledCount ? ` ${data.unscheduledCount} could not be placed and stay unscheduled.` : "";
      const locked = data.lockedCount ? ` Locked tasks left as pinned: ${data.lockedCount}.` : "";
      const held = data.heldCount ? ` ${data.heldCount} ${data.heldCount === 1 ? "task is" : "tasks are"} waiting on materials and not scheduled.` : "";
      return `Success! Scheduled ${data.scheduledCount} tasks onto your Google Calendar.${last}${days}${left}${locked}${held}`;
    }

    const MAX_MATERIALS = 30;

    // The unchecked materials of a task as [{id, text}] (none when it has no list or everything is checked).
    function openMaterialsOf(task) {
      return task && Array.isArray(task.materials) ? task.materials.filter(m => m && m.checked !== true) : [];
    }

    // The chip text for a task's materials: "" without a list, "Waiting on materials (2 of 5 ready)" while some are
    // unchecked, "Materials ready" once all are checked.
    function materialsChipText(task) {
      const list = task && Array.isArray(task.materials) ? task.materials : [];
      if (list.length === 0) return "";
      const open = openMaterialsOf(task).length;
      return open === 0 ? "Materials ready" : `Waiting on materials (${list.length - open} of ${list.length} ready)`;
    }

    // What the Materials card lists: [{taskId, title, materials: [{id, text}]}] for every task with an unchecked
    // material, in list order (by `order`). Checked materials are left out.
    function openMaterialGroups(tasks) {
      return [...tasks]
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(t => ({ taskId: t.id, title: t.title, materials: openMaterialsOf(t).map(m => ({ id: m.id, text: m.text })) }))
        .filter(g => g.materials.length > 0);
    }

    // How many unchecked materials there are across all tasks.
    function openMaterialCount(tasks) {
      return tasks.reduce((n, t) => n + openMaterialsOf(t).length, 0);
    }

    // The task's full materials list with one item's checked state set (the whole list is what gets saved).
    function withMaterialChecked(task, materialId, checked) {
      return (Array.isArray(task.materials) ? task.materials : []).map(m => (m.id === materialId ? { ...m, checked } : m));
    }

    // The edit form's materials as the updateTaskDirect field: blank rows are dropped and an empty list is null
    // (no materials). The server stays the validator.
    function materialsFields(list) {
      const items = list
        .map(m => ({ id: m.id, text: String(m.text ?? "").trim(), checked: m.checked === true }))
        .filter(m => m.text !== "")
        .slice(0, MAX_MATERIALS);
      return items.length > 0 ? items : null;
    }

    const MAX_PROJECT_ORDER = 999;

    // The project fields of the edit form as updateTaskDirect fields. No project means neither; an empty or
    // unusable order means unordered (null); a number is rounded and kept within 1..999. The server stays the validator.
    function projectFields(projectId, orderText) {
      if (!projectId) return { projectId: null, projectOrder: null };
      const text = String(orderText ?? "").trim();
      const n = text === "" ? NaN : Number(text);
      return { projectId, projectOrder: Number.isFinite(n) ? Math.min(Math.max(Math.round(n), 1), MAX_PROJECT_ORDER) : null };
    }

    // "Kitchen reno · 2" for a task in a known project ("Kitchen reno" when it has no order number), else "".
    function projectLabel(task, projects) {
      const project = task && task.projectId ? projects.find(p => p.id === task.projectId) : null;
      if (!project) return "";
      return Number.isInteger(task.projectOrder) ? `${project.name} · ${task.projectOrder}` : project.name;
    }

    // Members per project: {projectId: count}, for tasks that belong to one.
    function projectTaskCounts(tasks) {
      const counts = {};
      for (const t of tasks) {
        if (t.projectId) counts[t.projectId] = (counts[t.projectId] || 0) + 1;
      }
      return counts;
    }

    // Whether a task's title matches a search: every word of `query` (case-insensitive, any order, part of a word is
    // enough) must appear in the title. Tags and projects have their own filters. An empty query matches everything.
    function matchesSearch(task, query) {
      const words = String(query || "").toLowerCase().split(/\s+/).filter(Boolean);
      if (words.length === 0) return true;
      const title = typeof task.title === "string" ? task.title.toLowerCase() : "";
      return words.every(w => title.includes(w));
    }

    // The tasks the Queue shows: those carrying the chosen tag (null = any), belonging to the chosen project
    // (a project id, null = any) and whose title matches the search text (see matchesSearch). All three apply
    // together. Pure: the input is not modified.
    function filterTasks(tasks, tag, projectId, query = "") {
      return tasks.filter(t => (tag === null || (t.tags || []).includes(tag)) && (projectId === null || t.projectId === projectId) && matchesSearch(t, query));
    }

    // The confirmation text for deleting a project with `count` member tasks.
    function deleteProjectPrompt(name, count) {
      if (!count) return `Delete project "${name}"?`;
      return `Delete project "${name}"? ${count === 1 ? "Its 1 task stays" : `Its ${count} tasks stay`} on the list but ${count === 1 ? "leaves" : "leave"} the project.`;
    }
    // </pure-helpers>

    window.addEventListener("DOMContentLoaded", () => {
      // Live search: the list is redrawn on every keystroke (the box sits outside the list, so typing is not interrupted)
      document.getElementById("taskSearch").addEventListener("input", () => {
        document.getElementById("clearSearchBtn").hidden = document.getElementById("taskSearch").value === "";
        renderTasks();
      });
      document.getElementById("clearSearchBtn").addEventListener("click", () => {
        const box = document.getElementById("taskSearch");
        box.value = "";
        document.getElementById("clearSearchBtn").hidden = true;
        box.focus();
        renderTasks();
      });
      document.getElementById("tagFilterBar").addEventListener("click", e => {
        const chip = e.target.closest(".filter-chip");
        if (!chip) return;
        setFilter(chip.hasAttribute("data-all") ? null : chip.dataset.tag);
      });

      document.getElementById("projectFilterBar").addEventListener("click", e => {
        const chip = e.target.closest(".filter-chip");
        if (!chip) return;
        setProjectFilter(chip.hasAttribute("data-all") ? null : chip.dataset.project);
      });

      document.getElementById("taskList").addEventListener("click", e => {
        const item = e.target.closest(".task-item");
        if (!item) return;
        const taskId = item.dataset.id;
        const btn = e.target.closest("[data-action]");
        if (btn && item.contains(btn)) {
          if (btn.dataset.action === "complete") completeTask(taskId);
          return;
        }
        openEditModal(taskId);
      });

      // The materials lists of the edit modal and of the add form share their behaviour
      for (const [boxId, getList, render, addBtnId, textId, add] of [
        ["editMaterials", () => editMaterials, renderEditMaterials, "addMaterialBtn", "newMaterialText", addEditMaterial],
        ["manualMaterials", () => manualMaterials, renderManualMaterials, "addManualMaterialBtn", "manualNewMaterialText", addManualMaterial]
      ]) {
        const box = document.getElementById(boxId);
        box.addEventListener("input", e => {
          const row = e.target.closest(".material-row");
          if (row && e.target.matches('input[type="text"]')) getList()[Number(row.dataset.index)].text = e.target.value;
        });
        box.addEventListener("change", e => {
          const row = e.target.closest(".material-row");
          if (row && e.target.matches('input[type="checkbox"]')) getList()[Number(row.dataset.index)].checked = e.target.checked;
        });
        box.addEventListener("click", e => {
          const btn = e.target.closest('[data-action="remove-material"]');
          const row = btn && btn.closest(".material-row");
          if (!row) return;
          getList().splice(Number(row.dataset.index), 1);
          render();
        });
        document.getElementById(addBtnId).addEventListener("click", add);
        document.getElementById(textId).addEventListener("keydown", e => {
          if (e.key === "Enter") { e.preventDefault(); add(); }
        });
      }

      document.getElementById("materialsList").addEventListener("click", e => {
        const title = e.target.closest("[data-open-task]");
        if (title) return openEditModal(title.dataset.openTask);
      });
      document.getElementById("materialsList").addEventListener("change", e => {
        const row = e.target.closest(".material-row");
        if (!row || !e.target.matches('input[type="checkbox"]')) return;
        checkMaterial(row.dataset.taskId, row.dataset.materialId, e.target.checked);
      });

      updateRecurUnit("manual"); // hides the interval controls until a frequency is chosen
      initAuth();
    });

    async function fetchTasks() {
      const listContainer = document.getElementById("taskList");
      try {
        const res = await apiFetch(GET_TASKS_URL);
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
      } catch (err) {
        listContainer.innerHTML = "<p>Error loading tasks: " + esc(err.message) + "</p>";
      }
    }

    async function submitTask() {
      const input = document.getElementById("taskInput").value;
      if (!input.trim()) return;
      const manual = document.getElementById("manualToggle").checked;

      setLoading(true);
      try {
        const body = manual ? manualTaskBody({
          title: input,
          priority: document.getElementById("manualPriority").value,
          estimatedMinutes: document.getElementById("manualMinutes").value,
          tags: document.getElementById("manualTags").value,
          dueDate: document.getElementById("manualDue").value,
          recurFreq: document.getElementById("manualRecurFreq").value,
          recurInterval: document.getElementById("manualRecurInterval").value,
          // Without the project list the form cannot offer a project, so it sends none
          projectId: projectsLoaded ? document.getElementById("manualProject").value : "",
          projectOrder: document.getElementById("manualProjectOrder").value,
          materials: manualMaterials
        }) : { input };
        const res = await apiFetch(ADD_TASK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        document.getElementById("taskInput").value = "";
        if (manual) {
          document.getElementById("manualTags").value = "";
          document.getElementById("manualDue").value = "";
          resetManualExtras();
        }
        renderFilterBar();
        renderTasks();
      } catch (err) {
        alert("Error updating tasks: " + err.message);
      } finally {
        setLoading(false);
      }
    }

    // Repeats, project and materials belong to one task, so they are cleared after each manual add
    function resetManualExtras() {
      document.getElementById("manualRecurFreq").value = "NONE";
      document.getElementById("manualRecurInterval").value = 1;
      updateRecurUnit("manual");
      document.getElementById("manualProject").value = "";
      updateProjectOrderField("manual");
      manualMaterials = [];
      document.getElementById("manualNewMaterialText").value = "";
      renderManualMaterials();
    }

    // The add form's project choices follow the project list; a chosen project that is gone is dropped
    function renderManualProjects() {
      const select = document.getElementById("manualProject");
      const chosen = select.value;
      select.replaceChildren(new Option("No project", ""), ...allProjects.map(p => new Option(p.name, p.id)));
      select.value = allProjects.some(p => p.id === chosen) ? chosen : "";
      updateProjectOrderField("manual");
    }

    // The "Undo" toast after a delete or completion: shown for 8 seconds; Undo asks the server to put the last removed
    // task back (it keeps one step for ten minutes, see undoRemove).
    let undoTimer = null;
    function showUndoToast(kind, title) {
      document.getElementById("undoToastText").textContent = removalMessage(kind, title);
      document.getElementById("undoToast").hidden = false;
      clearTimeout(undoTimer);
      undoTimer = setTimeout(hideUndoToast, 8000);
    }
    function hideUndoToast() {
      clearTimeout(undoTimer);
      document.getElementById("undoToast").hidden = true;
    }
    async function undoRemoval() {
      hideUndoToast();
      try {
        const res = await apiFetch(UNDO_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
      } catch (err) {
        alert("Error undoing: " + err.message);
      }
    }

    async function completeTask(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      try {
        const res = await apiFetch(COMPLETE_TASK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
        if (task && !allTasks.some(t => t.id === taskId)) showUndoToast("COMPLETE", task.title);
      } catch (err) {
        alert("Error completing task: " + err.message);
      }
    }

    async function completeTaskFromModal() {
      const taskId = document.getElementById("editTaskId").value;
      closeEditModal();
      await completeTask(taskId);
    }

    async function scheduleWeek() {
      const statusDiv = document.getElementById("scheduleStatus");
      const btn = document.getElementById("schedBtn");
      btn.disabled = true;
      statusDiv.style.display = "block";
      try {
        // Runs use the saved settings, so a changed "days ahead", gap or lunch break that was never saved would be ignored: save first.
        if (currentSettings && scheduleFieldsChanged()) {
          statusDiv.innerText = "Saving settings...";
          if (!(await saveSettings())) {
            statusDiv.innerText = "Not scheduled: " + document.getElementById("settingsStatus").textContent;
            return;
          }
        }
        statusDiv.innerText = "Reading calendar, checking weather, and scheduling tasks...";
        const res = await apiFetch(SCHEDULE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (data.success) {
          statusDiv.innerText = scheduleSummary(data);
          fetchTasks();
        } else {
          statusDiv.innerText = data.error || data.message || "Failed to generate schedule.";
        }
      } catch (err) {
        statusDiv.innerText = "Error scheduling week: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function renderFilterBar() {
      const bar = document.getElementById("tagFilterBar");
      let html = `<div class="filter-chip ${selectedTagFilter === null ? 'active' : ''}" data-all="1">All (${allTasks.length})</div>`;
      sortedTags(allTasks).forEach(tag => {
        const count = allTasks.filter(t => (t.tags || []).includes(tag)).length;
        html += `<div class="filter-chip ${selectedTagFilter === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)} (${count})</div>`;
      });
      bar.innerHTML = html;
      // Shown in the heading so a filter stays visible while its section is collapsed
      document.getElementById("tagsActive").textContent = selectedTagFilter === null ? "" : `· ${selectedTagFilter}`;
    }

    function setFilter(tag) {
      selectedTagFilter = tag;
      renderFilterBar();
      renderTasks();
    }

    function setProjectFilter(projectId) {
      selectedProjectFilter = projectId;
      renderTasks(); // redraws the project chips too
    }

    function projectChip(t) {
      const label = projectLabel(t, allProjects);
      return label ? `<span class="chip project-chip" title="Project and order number">📁 ${esc(label)}</span>` : "";
    }

    function materialsChip(t) {
      const text = materialsChipText(t);
      if (!text) return "";
      return openMaterialsOf(t).length > 0 ?
        `<span class="chip held-chip" title="Not scheduled until every material is checked off">🧰 ${esc(text)}</span>` :
        `<span class="chip">🧰 ${esc(text)}</span>`;
    }

    function scheduleChip(t) {
      const when = formatSchedule(t.scheduledStart, t.scheduledEnd);
      if (when) return `<span class="chip sched-chip" title="Scheduled on your calendar">📅 ${esc(when)}</span>`;
      // Scheduled before times were stored; refreshed by the next full run
      return t.googleCalendarEventId ? `<span class="chip sched-chip">📅 Synced</span>` : "";
    }

    function renderTasks() {
      tasksLoaded = true;
      renderProjects();
      renderMaterialsCard();
      const listContainer = document.getElementById("taskList");
      let filtered = filterTasks(allTasks, selectedTagFilter, selectedProjectFilter, document.getElementById("taskSearch").value);

      if (filtered.length === 0) {
        listContainer.innerHTML = allTasks.length === 0 ?
          "<p style='color:#666;'>No active tasks in queue.</p>" :
          "<p style='color:#666;'>No tasks match the search and filters.</p>";
        return;
      }

      // Overdue tasks first (most overdue first), then everything else by rank
      filtered = [...filtered].sort((a, b) => {
        const da = daysUntilDue(a), db = daysUntilDue(b);
        const oa = da !== null && da < 0, ob = db !== null && db < 0;
        if (oa !== ob) return oa ? -1 : 1;
        if (oa && da !== db) return da - db;
        return a.order - b.order;
      });

      listContainer.innerHTML = filtered.map(t => `
        <div class="task-item" data-id="${esc(t.id)}">
          <div style="flex:1;">
            <strong>#${esc(t.order)} ${esc(t.title)}</strong>
            <div class="task-meta">
              <span class="badge ${PRIORITIES.includes(t.priority) ? t.priority : ''}">${esc(t.priority)}</span>
              <span class="time-chip">⏱️ ${esc(t.estimatedMinutes || 15)}m</span>
              ${(t.tags || []).map(tag => `<span class="chip">${esc(tag)}</span>`).join('')}
              ${projectChip(t)}
              ${(() => { const d = daysUntilDue(t); return d !== null && d < 0 ? `<span class="chip overdue-chip" title="Due ${esc(t.dueDate)}">⚠️ Overdue ${esc(-d)}d</span>` : ''; })()}
              ${t.dueDate ? `<span class="chip">Due: ${esc(t.dueDate)}</span>` : ''}
              ${recurrenceChip(t)}
              ${scheduleChip(t)}
              ${materialsChip(t)}
              ${t.locked ? `<span class="chip lock-chip" title="Pinned: its event was moved to your personal calendar, so Update now leaves it alone">🔒 Locked</span>` : ''}
            </div>
          </div>
          <div class="action-btns">
            <button class="complete-btn" title="Complete & Archive Task" data-action="complete">✅</button>
          </div>
        </div>
      `).join("");
    }

    function renderMaterialRows(boxId, list) {
      document.getElementById(boxId).innerHTML = list.map((m, i) => `
        <div class="material-row" data-index="${i}">
          <input type="checkbox" ${m.checked ? "checked" : ""} aria-label="Got it">
          <input type="text" maxlength="100" value="${esc(m.text)}">
          <button type="button" class="btn-secondary" data-action="remove-material" title="Remove">✕</button>
        </div>`).join("");
    }

    function addMaterialTo(list, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return false;
      if (list.length >= MAX_MATERIALS) { alert(`A task can have at most ${MAX_MATERIALS} materials.`); return false; }
      list.push({ id: "", text, checked: false });
      input.value = "";
      return true;
    }

    function renderEditMaterials() { renderMaterialRows("editMaterials", editMaterials); }
    function renderManualMaterials() { renderMaterialRows("manualMaterials", manualMaterials); }
    function addEditMaterial() { if (addMaterialTo(editMaterials, "newMaterialText")) renderEditMaterials(); }
    function addManualMaterial() { if (addMaterialTo(manualMaterials, "manualNewMaterialText")) renderManualMaterials(); }

    // The Materials card: every unchecked material of every task, grouped by task, so nothing holding a task back
    // is out of sight. Checking one saves it and removes it from the card.
    function renderMaterialsCard() {
      const groups = openMaterialGroups(allTasks);
      const count = openMaterialCount(allTasks);
      document.getElementById("materialsCount").textContent = count === 0 ? "" : `(${count})`;
      document.getElementById("materialsList").innerHTML = groups.length === 0 ?
        "<p style='color:#666; margin:0;'>Nothing to get.</p>" :
        groups.map(g => `
          <div class="material-group">
            <div class="material-group-title" data-open-task="${esc(g.taskId)}" title="Open this task">${esc(g.title)}</div>
            ${g.materials.map(m => `
              <label class="material-row" data-task-id="${esc(g.taskId)}" data-material-id="${esc(m.id)}">
                <input type="checkbox"> <span>${esc(m.text)}</span>
              </label>`).join("")}
          </div>`).join("");
    }

    async function checkMaterial(taskId, materialId, checked) {
      const task = allTasks.find(t => t.id === taskId);
      const status = document.getElementById("materialsStatus");
      if (!task || materialsBusy) return renderMaterialsCard(); // redraw so the box matches the stored state
      materialsBusy = true;
      status.textContent = "Saving...";
      try {
        const res = await apiFetch(DIRECT_UPDATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId, action: "UPDATE", updatedFields: { materials: withMaterialChecked(task, materialId, checked) } })
        });
        const data = await res.json();
        allTasks = data.tasks || allTasks;
        status.textContent = "";
        renderFilterBar();
        renderTasks();
      } catch (err) {
        status.textContent = "Could not save: " + err.message;
        renderMaterialsCard();
      } finally {
        materialsBusy = false;
      }
    }

    function openEditModal(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById("editTaskId").value = task.id;
      document.getElementById("editTitle").value = task.title || "";
      document.getElementById("editPriority").value = task.priority || "MEDIUM";
      document.getElementById("editDuration").value = task.estimatedMinutes || 15;
      document.getElementById("editTags").value = (task.tags || []).join(", ");
      document.getElementById("editDueDate").value = task.dueDate || "";
      const recurrence = task.recurrence;
      document.getElementById("editRecurFreq").value = recurrence && RECUR_UNITS[recurrence.frequency] ? recurrence.frequency : "NONE";
      document.getElementById("editRecurInterval").value = recurrence && recurrence.interval > 0 ? recurrence.interval : 1;
      updateRecurUnit();

      const projectSelect = document.getElementById("editProject");
      projectSelect.replaceChildren(new Option("No project", ""), ...allProjects.map(p => new Option(p.name, p.id)));
      // A project this page does not know: keep it selectable so saving the task unchanged leaves it alone
      if (task.projectId && !allProjects.some(p => p.id === task.projectId)) projectSelect.add(new Option("Unknown project", task.projectId));
      projectSelect.value = task.projectId || "";
      document.getElementById("editProjectOrder").value = Number.isInteger(task.projectOrder) ? task.projectOrder : "";
      updateProjectOrderField();

      editMaterials = (Array.isArray(task.materials) ? task.materials : []).map(m => ({ id: m.id, text: m.text, checked: m.checked === true }));
      document.getElementById("newMaterialText").value = "";
      renderEditMaterials();

      document.getElementById("editModal").style.display = "flex";
      document.body.classList.add("modal-open"); // the page behind must not scroll with the modal
    }

    // "🔁 Weekly" for an interval of 1, "🔁 Every 2 weeks" otherwise; nothing for a task that does not repeat
    const RECUR_LABELS = { DAILY: ["Daily", "day"], WEEKLY: ["Weekly", "week"], MONTHLY: ["Monthly", "month"], YEARLY: ["Yearly", "year"] };
    function recurrenceChip(t) {
      const r = t.recurrence;
      const labels = r && RECUR_LABELS[r.frequency];
      if (!labels) return "";
      const text = r.interval > 1 ? `Every ${r.interval} ${labels[1]}s` : labels[0];
      return `<span class="chip repeat-chip" title="Completing it creates the next one">🔁 ${esc(text)}</span>`;
    }

    const RECUR_UNITS = { DAILY: "day(s)", WEEKLY: "week(s)", MONTHLY: "month(s)", YEARLY: "year(s)" };

    // Shows the interval controls only when the task repeats
    // `prefix` picks the control: "edit" (the modal) or "manual" (the add form)
    function updateRecurUnit(prefix = "edit") {
      const freq = document.getElementById(`${prefix}RecurFreq`).value;
      const repeats = freq !== "NONE";
      document.getElementById(`${prefix}RecurEvery`).style.display = repeats ? "" : "none";
      document.getElementById(`${prefix}RecurInterval`).style.display = repeats ? "" : "none";
      document.getElementById(`${prefix}RecurUnit`).textContent = repeats ? RECUR_UNITS[freq] : "";
    }

    // The order number applies only inside a project: disabled and emptied without one
    function updateProjectOrderField(prefix = "edit") {
      const input = document.getElementById(`${prefix}ProjectOrder`);
      const inProject = document.getElementById(`${prefix}Project`).value !== "";
      input.disabled = !inProject;
      if (!inProject) input.value = "";
    }

    function clearEditDueDate() {
      document.getElementById("editDueDate").value = "";
    }

    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
      document.body.classList.remove("modal-open");
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === "editModal") closeEditModal();
    }

    async function saveTaskEdits() {
      const taskId = document.getElementById("editTaskId").value;
      const title = document.getElementById("editTitle").value;
      const priority = document.getElementById("editPriority").value;
      const estimatedMinutes = parseInt(document.getElementById("editDuration").value) || 15;
      const tagsRaw = document.getElementById("editTags").value;
      const dueDate = document.getElementById("editDueDate").value;

      const tags = tagsRaw.split(",").map(s => s.trim()).filter(Boolean);
      const recurrence = recurrenceFields(document.getElementById("editRecurFreq").value, document.getElementById("editRecurInterval").value);
      const updatedFields = { title, priority, estimatedMinutes, tags, dueDate, recurrence, materials: materialsFields(editMaterials) };
      // Without the project list the form cannot show the task's project, so it must not send one
      if (projectsLoaded) {
        Object.assign(updatedFields, projectFields(document.getElementById("editProject").value, document.getElementById("editProjectOrder").value));
      }

      closeEditModal();
      try {
        const res = await apiFetch(DIRECT_UPDATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId, action: "UPDATE", updatedFields })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
        return true;
      } catch (err) {
        alert("Failed to save changes: " + err.message);
        return false;
      }
    }

    // Saves the edits first so the new time reflects them, then moves just this task
    async function rescheduleFromModal() {
      const taskId = document.getElementById("editTaskId").value;
      if (!(await saveTaskEdits())) return;
      await rescheduleTask(taskId);
    }

    async function rescheduleTask(taskId) {
      const statusDiv = document.getElementById("scheduleStatus");
      const task = allTasks.find(t => t.id === taskId);
      statusDiv.style.display = "block";
      statusDiv.innerText = "Finding a new time...";
      try {
        const res = await apiFetch(RESCHEDULE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId })
        });
        const data = await res.json();
        allTasks = data.tasks || allTasks;
        renderFilterBar();
        renderTasks();
        statusDiv.innerText = `Rescheduled "${task ? task.title : "task"}".`;
      } catch (err) {
        statusDiv.innerText = "Error rescheduling: " + err.message;
        alert("Error rescheduling: " + err.message); // the status line lives on the Settings page, out of sight from the list
      }
    }

    // Tasks are deleted only from the edit modal, after a confirmation (cancelling leaves the modal open); the Undo
    // toast that follows is a second safety net
    async function deleteTaskFromModal() {
      if (!confirm("Delete this task?")) return;
      const taskId = document.getElementById("editTaskId").value;
      closeEditModal();
      await deleteTask(taskId);
    }

    async function deleteTask(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      try {
        const res = await apiFetch(DIRECT_UPDATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId, action: "DELETE" })
        });
        const data = await res.json();
        allTasks = data.tasks || [];
        renderFilterBar();
        renderTasks();
        if (task && !allTasks.some(t => t.id === taskId)) showUndoToast("DELETE", task.title);
      } catch (err) {
        alert("Error deleting task: " + err.message);
      }
    }

    function fmtMinutes(total) {
      const m = Math.round(Number(total) || 0);
      if (m < 60) return `${m}m`;
      return m % 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.floor(m / 60)}h`;
    }

    // Completion totals from getCompletedTasks: per week, by priority and by tag
    function renderSummary(summary) {
      if (!summary) return "";
      if (!summary.totalCount) {
        return `<div class="summary"><div class="summary-total" style="color:#666;">No completions in the last ${esc((summary.weeks || []).length)} weeks.</div></div>`;
      }
      const weeks = summary.weeks || [];
      const maxCount = Math.max(1, ...weeks.map(w => w.count));
      const weekRows = weeks.map(w => {
        const name = DATE_ONLY.test(w.weekStart) ? weekNameFmt.format(new Date(w.weekStart + "T00:00:00Z")) : w.weekStart;
        const pct = Math.round((w.count / maxCount) * 100);
        return `<div class="week-row"><span class="week-name">${esc(name)}</span><div class="week-bar"><div class="week-fill" style="width:${pct}%"></div></div><span class="week-val">${esc(w.count)} · ${esc(fmtMinutes(w.minutes))}</span></div>`;
      }).join("");
      const priorityChips = (summary.byPriority || []).filter(p => p.count > 0)
        .map(p => `<span class="badge ${PRIORITIES.includes(p.priority) ? p.priority : ''}">${esc(p.priority)} ${esc(p.count)} · ${esc(fmtMinutes(p.minutes))}</span>`).join(" ");
      const tagChips = (summary.byTag || []).slice(0, 10)
        .map(t => `<span class="chip">${esc(t.tag)} ${esc(t.count)} · ${esc(fmtMinutes(t.minutes))}</span>`).join(" ");
      return `
        <div class="summary">
          <div class="summary-total"><strong>${esc(summary.totalCount)}</strong> completed · <strong>${esc(fmtMinutes(summary.totalMinutes))}</strong> estimated, last ${esc(weeks.length)} weeks${summary.truncated ? " (newest entries only)" : ""}</div>
          <div class="summary-label">Per week (week starting Monday)</div>
          ${weekRows}
          ${priorityChips ? `<div class="summary-label">By priority</div><div class="task-meta" style="margin-top:0;">${priorityChips}</div>` : ""}
          ${tagChips ? `<div class="summary-label">By tag</div><div class="task-meta" style="margin-top:0;">${tagChips}</div>` : ""}
        </div>`;
    }

    async function fetchCompleted() {
      const list = document.getElementById("completedList");
      list.textContent = "Loading...";
      try {
        const res = await apiFetch(COMPLETED_URL);
        const data = await res.json();
        const tasks = data.tasks || [];
        if (tasks.length === 0) {
          list.innerHTML = "<p style='color:#666; margin:0;'>No completed tasks yet.</p>";
          return;
        }
        list.innerHTML = renderSummary(data.summary) + tasks.map(t => {
          const done = t.completedAt ? new Date(t.completedAt) : null;
          const when = done && !isNaN(done) ? formatInstant(done) : "";
          return `
            <div class="task-item" style="cursor: default;">
              <div style="flex:1;">
                <strong>${esc(t.title)}</strong>
                <div class="task-meta">
                  <span class="badge ${PRIORITIES.includes(t.priority) ? t.priority : ''}">${esc(t.priority)}</span>
                  <span class="time-chip">⏱️ ${esc(t.estimatedMinutes || 15)}m</span>
                  ${(t.tags || []).map(tag => `<span class="chip">${esc(tag)}</span>`).join('')}
                  ${when ? `<span class="chip">✅ ${esc(when)}</span>` : ''}
                </div>
              </div>
            </div>`;
        }).join("");
      } catch (err) {
        list.innerHTML = "<p>Error loading completed tasks: " + esc(err.message) + "</p>";
      }
    }

    // Projects: create, rename and delete through updateProject. The server returns the full project list each time,
    // and for a delete the task list too (its members leave the project).
    function setProjectsStatus(text) {
      document.getElementById("projectsStatus").textContent = text;
    }

    // The project chips (they filter the Queue like the tag chips do) and, for the chosen project, its Rename and Delete.
    function renderProjects() {
      if (!projectsLoaded) return;
      renderManualProjects();
      // A filter on a project that no longer exists (deleted here or elsewhere) is dropped
      if (selectedProjectFilter !== null && !allProjects.some(p => p.id === selectedProjectFilter)) selectedProjectFilter = null;
      const bar = document.getElementById("projectFilterBar");
      const actions = document.getElementById("projectActions");
      const chosen = allProjects.find(p => p.id === selectedProjectFilter) || null;
      document.getElementById("projectsActive").textContent = chosen ? `· ${chosen.name}` : "";
      if (allProjects.length === 0) {
        bar.innerHTML = "<span style='color:#666; font-size:13px;'>No projects yet.</span>";
        actions.innerHTML = "";
        return;
      }
      const counts = projectTaskCounts(allTasks);
      bar.innerHTML = `<div class="filter-chip ${chosen ? "" : "active"}" data-all="1">All (${allTasks.length})</div>` +
        allProjects.map(p => `<div class="filter-chip ${chosen && chosen.id === p.id ? "active" : ""}" data-project="${esc(p.id)}">📁 ${esc(p.name)} (${esc(counts[p.id] || 0)})</div>`).join("");
      actions.innerHTML = chosen ? `
        <div class="project-row" data-id="${esc(chosen.id)}">
          <span class="project-name">${esc(chosen.name)}</span>
          <button type="button" class="btn-secondary" data-action="rename">Rename</button>
          <button type="button" class="btn-danger" data-action="delete">Delete</button>
        </div>` : "";
    }

    async function loadProjects() {
      try {
        const res = await apiFetch(GET_PROJECTS_URL);
        allProjects = (await res.json()).projects || [];
        projectsLoaded = true;
        setProjectsStatus("");
        if (tasksLoaded) renderTasks(); else renderProjects(); // chips and counts need both lists
      } catch (err) {
        setProjectsStatus("Could not load projects: " + err.message);
      }
    }

    // Sends one updateProject request and shows the result; returns true when it was saved.
    async function saveProject(body, doneText) {
      setProjectsStatus("Saving...");
      try {
        const res = await apiFetch(UPDATE_PROJECT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        allProjects = data.projects || allProjects;
        projectsLoaded = true;
        if (data.tasks) {
          allTasks = data.tasks;
          renderFilterBar();
        }
        renderTasks();
        setProjectsStatus(doneText);
        return true;
      } catch (err) {
        setProjectsStatus("Not saved: " + err.message);
        return false;
      }
    }

    async function addProject() {
      const input = document.getElementById("newProjectName");
      const name = input.value.trim();
      if (!name) return;
      if (await saveProject({ action: "CREATE", name }, `Added "${name}".`)) input.value = "";
    }

    async function renameProject(projectId) {
      const project = allProjects.find(p => p.id === projectId);
      if (!project) return;
      const name = prompt("Rename project", project.name);
      if (name === null || !name.trim() || name.trim() === project.name) return;
      await saveProject({ action: "UPDATE", projectId, name }, "Renamed.");
    }

    async function deleteProject(projectId) {
      const project = allProjects.find(p => p.id === projectId);
      if (!project) return;
      if (!confirm(deleteProjectPrompt(project.name, projectTaskCounts(allTasks)[projectId] || 0))) return;
      await saveProject({ action: "DELETE", projectId }, `Deleted "${project.name}".`);
    }

    document.getElementById("addProjectBtn").addEventListener("click", addProject);
    document.getElementById("newProjectName").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); addProject(); }
    });
    document.getElementById("projectActions").addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      const row = btn && btn.closest(".project-row");
      if (!row) return;
      if (btn.dataset.action === "rename") renameProject(row.dataset.id);
      else if (btn.dataset.action === "delete") deleteProject(row.dataset.id);
    });

    // Settings: location (with place search), time zone and the automatic schedule.
    let currentSettings = null; // as last read from the server; null until they load
    let pendingLocation = null; // a place picked from the search and not saved yet, else null
    let placeMatches = [];

    function chosenPlace() {
      if (pendingLocation) return pendingLocation;
      const s = currentSettings;
      return { name: s.location.name, latitude: s.location.latitude, longitude: s.location.longitude, timeZone: s.timeZone };
    }

    function renderLocation() {
      const box = document.getElementById("settingsLocation");
      if (!currentSettings) { box.textContent = "Settings are not loaded."; return; }
      const place = chosenPlace();
      box.textContent = `📍 ${place.name} · ${place.timeZone}${pendingLocation ? " (not saved yet)" : ""}`;
    }

    function updateLunchFields() {
      const on = document.getElementById("lunchEnabled").checked;
      document.getElementById("lunchTime").disabled = !on;
      document.getElementById("lunchMinutes").disabled = !on;
    }

    // Whether the form holds days-ahead, gap, day-window or lunch values that differ from the saved settings (what a run uses).
    function scheduleFieldsChanged() {
      const s = currentSettings;
      const lunch = s.lunch || {};
      const day = s.day || {};
      return document.getElementById("scheduleDays").value !== String(s.scheduleDays)
        || document.getElementById("gapMinutes").value !== String(s.gapMinutes)
        || document.getElementById("dayStart").value !== String(day.start)
        || document.getElementById("dayEnd").value !== String(day.end)
        || document.getElementById("lunchEnabled").checked !== !!lunch.enabled
        || document.getElementById("lunchTime").value !== String(lunch.time)
        || document.getElementById("lunchMinutes").value !== String(lunch.minutes);
    }

    function setSettingsStatus(text) {
      document.getElementById("settingsStatus").textContent = text;
    }

    // Show settings from the server in the form, and switch every date and time on the page to the configured zone.
    function applySettings(s) {
      const zoneChanged = s.timeZone !== appTimeZone;
      currentSettings = s;
      pendingLocation = null;
      setTimeZone(s.timeZone);
      document.title = `TaskHub Next - ${s.location.name}`;
      renderLocation();
      document.getElementById("scheduleDays").value = typeof s.scheduleDays === "number" ? String(s.scheduleDays) : "";
      document.getElementById("gapMinutes").value = typeof s.gapMinutes === "number" ? String(s.gapMinutes) : "";
      const day = s.day || {};
      document.getElementById("dayStart").value = day.start || "";
      document.getElementById("dayEnd").value = day.end || "";
      const lunch = s.lunch || {};
      document.getElementById("lunchEnabled").checked = !!lunch.enabled;
      document.getElementById("lunchTime").value = lunch.time || "";
      document.getElementById("lunchMinutes").value = typeof lunch.minutes === "number" ? String(lunch.minutes) : "";
      updateLunchFields();
      document.getElementById("schedEnabled").checked = !!s.schedule.enabled;
      document.getElementById("schedInterval").value = scheduleChoice(s.schedule);
      const last = s.lastAutoRunAt ? new Date(s.lastAutoRunAt) : null;
      document.getElementById("settingsLastRun").textContent = last && !isNaN(last)
        ? `Last automatic run: ${formatInstant(last)} (${appTimeZone}).`
        : "No automatic run yet.";
      if (zoneChanged && tasksLoaded) renderTasks();
    }

    async function loadSettings() {
      try {
        const res = await apiFetch(GET_SETTINGS_URL);
        applySettings((await res.json()).settings);
        setSettingsStatus("");
      } catch (err) {
        renderLocation();
        setSettingsStatus("Could not load settings: " + err.message);
      }
    }

    async function searchPlaces() {
      const query = document.getElementById("placeQuery").value.trim();
      const box = document.getElementById("placeResults");
      if (!query) return;
      box.textContent = "Searching...";
      try {
        const res = await fetch(geocodeUrl(query)); // plain fetch: the Firebase token must not go to a third party
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        placeMatches = placesFromGeocode(await res.json());
        box.innerHTML = placeMatches.length
          ? placeMatches.map((p, i) => `<button type="button" class="place-option" data-index="${i}">${esc(p.name)} · ${esc(p.timeZone)}</button>`).join("")
          : "No places found.";
      } catch (err) {
        box.textContent = "Place search failed: " + err.message;
      }
    }

    async function saveSettings() {
      if (!currentSettings) { setSettingsStatus("Settings are not loaded yet."); return false; }
      const place = chosenPlace();
      const btn = document.getElementById("saveSettingsBtn");
      btn.disabled = true;
      setSettingsStatus("Saving...");
      try {
        const res = await apiFetch(UPDATE_SETTINGS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ settings: settingsPayload({
            location: place,
            timeZone: place.timeZone,
            scheduleDays: document.getElementById("scheduleDays").value,
            gapMinutes: document.getElementById("gapMinutes").value,
            dayStart: document.getElementById("dayStart").value,
            dayEnd: document.getElementById("dayEnd").value,
            lunchEnabled: document.getElementById("lunchEnabled").checked,
            lunchTime: document.getElementById("lunchTime").value,
            lunchMinutes: document.getElementById("lunchMinutes").value,
            enabled: document.getElementById("schedEnabled").checked,
            ...scheduleFromChoice(document.getElementById("schedInterval").value, currentSettings && currentSettings.schedule.intervalMinutes)
          }) })
        });
        const saved = (await res.json()).settings;
        applySettings(saved);
        if (typeof saved.scheduleDays !== "number" || typeof saved.gapMinutes !== "number" || !saved.day || !saved.lunch) {
          // An older deployed backend drops fields it does not know, so a setting would silently keep its old value
          setSettingsStatus("Saved, but the server ignored the days, gap, day or lunch setting. Deploy the latest functions.");
          return false;
        }
        setSettingsStatus("Saved.");
        return true;
      } catch (err) {
        setSettingsStatus("Not saved: " + err.message);
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("undoToastBtn").addEventListener("click", undoRemoval);
    document.getElementById("tabBar").addEventListener("click", e => {
      const btn = e.target.closest("[data-tab]");
      if (btn) showTab(btn.dataset.tab);
    });
    document.getElementById("lunchEnabled").addEventListener("change", updateLunchFields);
    document.getElementById("manualToggle").addEventListener("change", e => {
      document.getElementById("manualFields").hidden = !e.target.checked;
    });
    document.getElementById("placeSearchBtn").addEventListener("click", searchPlaces);
    document.getElementById("placeQuery").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); searchPlaces(); }
    });
    document.getElementById("placeResults").addEventListener("click", e => {
      const option = e.target.closest(".place-option");
      if (!option || !placeMatches[Number(option.dataset.index)]) return;
      pendingLocation = placeMatches[Number(option.dataset.index)];
      document.getElementById("placeResults").textContent = "";
      document.getElementById("placeQuery").value = "";
      renderLocation();
    });
    document.getElementById("saveSettingsBtn").addEventListener("click", saveSettings);

    function setLoading(isLoading) {
      document.getElementById("addBtn").disabled = isLoading;
      document.getElementById("taskInput").disabled = isLoading;
    }
  </script>
</body>
</html>
